/* design layout: mermaid flowcharts rendered offline as diagrams (flow.js; other types
 * via the CDN, source shown offline); ## Interfaces as API cards (method / path chips
 * when a bullet names an endpoint); ## Key Decisions as Problem -> Solution -> Cost rows;
 * ## Migration bullets as labelled rows. */
(function () {
  'use strict';
  var SDD = window.SDD, h = SDD.h;
  var ENDPOINT = /\b(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(\/[^\s`|,;)]*)/g;

  function interfaceCard(item) {
    var first = item.first.replace(/^- /, '');
    var title = null, rest = first;
    var bold = /^\*\*(.+?)\*\*:? *(.*)$/.exec(first);
    var label = /^([^:`*]{1,48}): (.*)$/.exec(first);
    if (bold) { title = bold[1]; rest = bold[2]; }
    else if (label) { title = label[1]; rest = label[2]; }
    var text = [rest].concat(SDD.dedent(item.cont)).join('\n');
    var endpoints = [], m;
    ENDPOINT.lastIndex = 0;
    while ((m = ENDPOINT.exec(text))) endpoints.push({ method: m[1], path: m[2] });
    return SDD.card({
      icon: title ? (endpoints.length ? 'arrow-right' : 'file') : null,
      titleHtml: title ? SDD.mdInline(title) : undefined,
      body: [
        endpoints.length ? h('div', { class: 'api-line' }, endpoints.map(function (e) {
          return h('span', { class: 'chip chip-accent method' }, [h('span', { text: e.method }), h('span', { class: 'path', text: ' ' + e.path })]);
        })) : null,
        h('div', { class: 'card-body prose', html: SDD.md(text) })

  }

  function interfaces(block) {
    var fb = SDD.fallbackFor('Interfaces');

    var its = SDD.items(block.body, /^- /);

    var grid = null;
    its.forEach(function (b) {
      if (b.kind === 'text') {
        grid = null;
        var text = b.lines.join('\n');
        var sub = /^### +(.+)$/m.exec(text);
        if (sub && text.trim() === sub[0].trim()) { body.appendChild(h('h3', { class: 'sub-title', text: sub[1] })); return; }
        SDD.richBlocks(text).forEach(function (n) { body.appendChild(n); });

      grid.appendChild(interfaceCard(b));

  }

  /* Key Decisions: `**title**` or `### title` opens a decision; `- Label: text` bullets

  function keyDecisions(block) {

      (cur ? cur.lines : lead).push(l);
    });
    var body = SDD.section(block.name, { src: 'design.md', count: groups.length });
    if (lead.join('').trim() !== '') SDD.richBlocks(lead.join('\n')).forEach(function (n) { body.appendChild(n); });
    groups.forEach(function (g) {
      var fields = {}, order = [], rest = [];
      SDD.items(g.lines, /^- /).forEach(function (b) {
        if (b.kind === 'text') { rest = rest.concat(b.lines); return; }
        var line = SDD.itemLine(b, /^- /);
        var m = /^([A-Za-z][A-Za-z \/-]{0,40}):\s*([\s\S]*)$/.exec(line);
        if (!m) { rest.push(b.first); rest = rest.concat(b.cont); return; }
        var k = m[1].toLowerCase();
        fields[k] = m[2]; order.push({ key: m[1], k: k });
      });
      function step(k, cls) {
        return h('div', { class: 'kd-step ' + cls }, [h('div', { class: 'ba-label', text: SDD.fieldLabel(k) }), h('div', { html: SDD.mdInline(fields[k]) })]);
      }

        titleHtml: SDD.mdInline(g.title),

    var title = SDD.docTitle() || SDD.t('view.fallbackTitle', SDD.t('stage.' + stage));
    SDD.hero({
      chips: SDD.baseChips(title),

      tiles: [

})();
